version: 1
formatters:
  simple:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    level: INFO
    stream: ext://sys.stdout
loggers:
  ingestion:
    handlers: [console]
    level: INFO
    propagate: no
root:
  handlers: [console]
  level: WARNING
