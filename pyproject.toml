[project]
name = "04-rag-telco-v1"
version = "0.1.0"
description = "Telecom policy document RAG system"
requires-python = ">=3.12"

dependencies = [
    "httpx",
    "python-dotenv",
    "pyyaml",
    "pydantic",
    "llama-index",
    "psycopg>=3.3.5",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
