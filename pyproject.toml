[project]
name = "rag-pgvector"
version = "0.1.0"
description = "Retrieval-Augmented Generation system with pgvector persistence"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6",
    "openai>=3.14.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
