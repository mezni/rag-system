services:
  postgres:
    image: postgres:17
    container_name: rag-system-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rag_system
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: